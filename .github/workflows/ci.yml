name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: Build and test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux Clang
            os: ubuntu-latest
            compiler: clang
            cc: clang
            cxx: clang++
          - name: Linux GCC
            os: ubuntu-latest
            compiler: gcc
            cc: gcc
            cxx: g++
          - name: Windows MSVC
            os: windows-latest
            compiler: msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: build/_deps
          key: ${{ runner.os }}-${{ matrix.compiler }}-deps-${{ hashFiles('CMakeLists.txt') }}
      - name: Install Clang
        if: matrix.compiler == 'clang'
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: Configure (Clang/GCC)
        if: matrix.compiler != 'msvc'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
      - name: Configure (MSVC)
        if: matrix.compiler == 'msvc'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: CTest
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Frontend typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Frontend tests
        working-directory: frontend
        run: npm test -- --reporter=dot
      - name: Frontend build
        working-directory: frontend
        run: npm run build

  asan-ubsan:
    name: ASan and UBSan (Linux Clang)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Clang
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: Configure
        run: cmake -S . -B build-asan -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DBASALT_ENABLE_SANITIZERS=ON
      - name: Build
        run: cmake --build build-asan --parallel
      - name: CTest
        run: ctest --test-dir build-asan --output-on-failure

  tsan:
    name: ThreadSanitizer (Linux Clang)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Clang
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: Configure
        run: cmake -S . -B build-tsan -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DBASALT_ENABLE_TSAN=ON
      - name: Build
        run: cmake --build build-tsan --parallel
      - name: CTest
        run: ctest --test-dir build-tsan --output-on-failure

  fuzz-smoke:
    name: libFuzzer smoke (Linux Clang)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Clang
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: Configure
        run: cmake -S . -B build-fuzz -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DBASALT_ENABLE_FUZZERS=ON
      - name: Build
        run: cmake --build build-fuzz --parallel
      - name: Fuzz EventLog recovery
        run: ./build-fuzz/basalt_fuzz_event_log -max_total_time=30 -max_len=65536 fuzz/corpus/event_log
      - name: Fuzz CSV parser
        run: ./build-fuzz/basalt_fuzz_csv -max_total_time=30 -max_len=262144 fuzz/corpus/csv
      - name: Fuzz JSONL replay parser
        run: ./build-fuzz/basalt_fuzz_jsonl -max_total_time=30 -max_len=262144 fuzz/corpus/jsonl
      - name: Fuzz order-book state transitions
        run: ./build-fuzz/basalt_fuzz_order_book -max_total_time=30 -max_len=6912 fuzz/corpus/order_book
      - name: Fuzz JSON parser
        run: ./build-fuzz/basalt_fuzz_json -max_total_time=30 -max_len=262144 fuzz/corpus/json
      - name: Fuzz MCP frames
        run: ./build-fuzz/basalt_fuzz_mcp -max_total_time=30 -max_len=307200 fuzz/corpus/mcp
      - name: Fuzz HTTP mutation validation
        run: ./build-fuzz/basalt_fuzz_http_validation -max_total_time=30 -max_len=65537 fuzz/corpus/http_validation

  security-scans:
    name: Dependency and secret scans
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: npm dependency audit
        working-directory: frontend
        run: npm audit --package-lock-only --audit-level=low
      - name: Verify FetchContent pins and CycloneDX SBOM
        run: python scripts/dependency_sbom.py --check
      - name: OSV dependency scan
        run: >-
          docker run --rm
          -v "${{ github.workspace }}:/src"
          -w /src
          ghcr.io/google/osv-scanner:v2.7.1@sha256:a70ffffc2bfd33482953e5d6b64c6fcdb30239717a07b0f0d3ab2859ce3e4cde
          scan source --recursive /src
      - name: Gitleaks history scan
        run: >-
          docker run --rm
          -v "${{ github.workspace }}:/src"
          -w /src
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git --redact=100 --no-banner --log-opts=--all /src

  clang-tidy:
    name: C++ static analysis (Clang)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Clang tooling
        run: sudo apt-get update && sudo apt-get install -y clang clang-tidy
      - name: Configure compile commands
        run: cmake -S . -B build-clang-tidy -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: Analyze C++ sources
        run: >-
          find src -type f -name '*.cpp' -print0 |
          xargs -0 -r clang-tidy -p build-clang-tidy
          --checks='-*,clang-analyzer-core.*,clang-analyzer-cplusplus.*,-clang-analyzer-core.StackAddressEscape'
          --warnings-as-errors='*'
